[project]
name = "career"
version = "0.1.0"
description = "Career profile, job-opportunity aggregation and market/advancement insights"
requires-python = ">=3.12"

# One package, one image, several entrypoints (serve, pipeline, show, seed).
# They share the model and the store, so splitting them would mean multiple
# builds of near-identical layers.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "jinja2>=3.1",
  # FastAPI's Form() parsing needs it, and the failure without it is a 500
  # at the first form post rather than anything at import time.
  "python-multipart>=0.0.20",
  "azure-identity>=1.19",
  "azure-keyvault-secrets>=4.9",
  "azure-storage-blob>=12.24",
  "azure-monitor-opentelemetry>=1.6",
  # The job-board adapter (Reed) needs an HTTP client.
  # The advancement-guidance step's DeepSeek call deliberately does not: its
  # API is OpenAI-compatible, so a plain urllib.request call is enough for
  # one request a day — see advancement.py.
  "httpx>=0.27",
]

[project.optional-dependencies]
# httpx2, not httpx: starlette's TestClient deprecated the latter, and with
# `filterwarnings = ["error"]` below that deprecation fails collection
# outright — same call-out as jay-withers/gym-log's identical pyproject.toml.
dev = ["pytest>=8.3", "ruff>=0.8", "httpx2>=0.28", "respx>=0.21"]

# What the Dockerfile's ENTRYPOINT resolves to. Terraform sets no `command`,
# so this name lives in exactly one place.
[project.scripts]
career = "career.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S: bandit's security rules, so a risky pattern fails the commit locally
# rather than waiting for CodeQL on the pull request.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Body", "fastapi.Cookie", "fastapi.Depends", "fastapi.Form",
  "fastapi.Header", "fastapi.Path", "fastapi.Query", "fastapi.File",
]

# Test code is exempt from the bandit rules that only make sense in shipped
# code: pytest is built on `assert` (S101), fixtures use dummy tokens (S105,
# S106) and loopback binds (S104), and a test may shell out on purpose (S603,
# S607). Everything else under "S" still applies to tests.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # Warnings are errors, so a deprecation in a dependency is seen on the bump
  # that introduced it rather than on the release that removes the feature.
  "error",
]

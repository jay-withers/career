[project]
name = "career"
version = "0.1.0"
description = "Career profile, LinkedIn-export import, job-opportunity aggregation and market/advancement insights"
requires-python = ">=3.12"

# One package, one image, three entrypoints (serve, pipeline, import-linkedin).
# They share the model and the store, so splitting them would mean multiple
# builds of near-identical layers.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "jinja2>=3.1",
  # FastAPI's Form()/UploadFile parsing needs it (the LinkedIn export upload),
  # and the failure without it is a 500 at the first upload rather than
  # anything at import time.
  "python-multipart>=0.0.20",
  "azure-identity>=1.19",
  "azure-keyvault-secrets>=4.9",
  "azure-storage-blob>=12.24",
  "azure-monitor-opentelemetry>=1.6",
  # The job-board adapters (Adzuna, RemoteOK, Arbeitnow) and nothing else here
  # needs an HTTP client.
  "httpx>=0.27",
  # The advancement-guidance synthesis step's LLM call.
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "respx>=0.21"]

# What the Dockerfile's ENTRYPOINT resolves to. Terraform sets no `command`,
# so this name lives in exactly one place.
[project.scripts]
career = "career.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Body", "fastapi.Cookie", "fastapi.Depends", "fastapi.Form",
  "fastapi.Header", "fastapi.Path", "fastapi.Query", "fastapi.File",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # Warnings are errors, so a deprecation in a dependency is seen on the bump
  # that introduced it rather than on the release that removes the feature.
  "error",
]

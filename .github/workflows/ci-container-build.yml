name: ci-container-build

# Builds the image on a pull request, without pushing.
#
# The runners are amd64, which is what Container Apps runs, so this build is
# native — proving the image builds on the target architecture is the point.
#
# The mechanics live in jay-withers/workflows' docker.yml, which cd-publish
# also calls, so the two stay honest against each other.
on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci-container-build.yml

permissions:
  contents: read

jobs:
  # push is left at its default of false: a pull request must never publish
  # an image.
  #
  # Deliberately **not** a required status check: the path filter above means
  # a docs-only pull request never runs it, and a required check that never
  # reports leaves the pull request pending for ever rather than failing it.
  build:
    permissions:
      contents: read
    uses: jay-withers/workflows/.github/workflows/docker.yml@a5015ee2aed310376c5a0a1b19ced327dfd4fbd4 # v1.4.5
    with:
      images: |
        [{"name": "career", "context": "."}]

  # `build` above proves the image builds; it doesn't prove it runs. Docker
  # exports a `push: false` build straight to the layer cache with nothing
  # left in the local daemon to inspect, so this rebuilds it (a cache hit
  # against the same scope, not a second real build), loads it locally, and
  # checks both things the Dockerfile's own comment warns can go
  # wrong silently: the wrong --platform produces an image that reports the
  # wrong architecture, and one that crash-loops with an exec format error
  # and no other clue right up until Container Apps starts it.
  verify:
    name: Verify image architecture and startup
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build career image for local inspection
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: career:ci-verify
          cache-from: type=gha,scope=career

      - name: Verify the image reports linux/amd64
        run: |
          platform="$(docker image inspect career:ci-verify --format '{{.Os}}/{{.Architecture}}')"
          echo "image platform: $platform"
          if [ "$platform" != "linux/amd64" ]; then
            echo "::error::built image reports '$platform', not linux/amd64 — Container Apps only runs amd64 and this image would crash-loop with an exec format error and no other clue (see the Dockerfile's own comment)."
            exit 1
          fi

      - name: Start the container and wait for it to report healthy
        run: |
          docker run -d --name career-ci career:ci-verify

          for _ in $(seq 1 30); do
            state="$(docker inspect --format='{{.State.Status}}' career-ci)"
            health="$(docker inspect --format='{{.State.Health.Status}}' career-ci)"
            echo "container state: $state, health: $health"

            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            if [ "$state" = "exited" ] || [ "$state" = "dead" ] || [ "$health" = "unhealthy" ]; then
              echo "::error::career-ci did not come up healthy (state: $state, health: $health) — see the logs above."
              exit 1
            fi
            sleep 2
          done

          echo "::error::career-ci never reported healthy within the timeout — see the logs above."
          exit 1

      - name: Container logs
        if: always()
        run: docker logs career-ci

      - name: Clean up
        if: always()
        run: docker rm -f career-ci

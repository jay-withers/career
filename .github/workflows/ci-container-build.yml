name: ci-container-build

# Builds the image on a pull request, without pushing.
#
# The runners are amd64, which is what Container Apps runs, so this build is
# native — proving the image builds on the target architecture is the point.
#
# The mechanics live in jay-withers/workflows' docker.yml, which cd-publish
# also calls, so the two stay honest against each other.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The path filter lives here rather than on the trigger, so the workflow runs
  # on every pull request and the container-build gate below always reports.
  # A trigger-level filter would mean a docs-only pull request never produced
  # the check, and a required check that never reports leaves the pull request
  # pending for ever.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            image:
              - 'src/**'
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci-container-build.yml'

  # push is left at its default of false: a pull request must never publish
  # an image.
  build:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      security-events: write # Trivy findings to code scanning
    uses: jay-withers/workflows/.github/workflows/docker.yml@dc63b76bc1bc531e8c81dbf1e2833bf22ab355f5 # v1.16.0
    with:
      images: |
        [{"name": "career", "context": "."}]

  # `build` above proves the image builds; it doesn't prove it runs. Docker
  # exports a `push: false` build straight to the layer cache with nothing
  # left in the local daemon to inspect, so this rebuilds it (a cache hit
  # against the same scope, not a second real build), loads it locally, and
  # checks both things the Dockerfile's own comment warns can go
  # wrong silently: the wrong --platform produces an image that reports the
  # wrong architecture, and one that crash-loops with an exec format error
  # and no other clue right up until Container Apps starts it.
  verify:
    name: Verify image architecture and startup
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build career image for local inspection
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: career:ci-verify
          cache-from: type=gha,scope=career

      - name: Verify the image reports linux/amd64
        run: |
          platform="$(docker image inspect career:ci-verify --format '{{.Os}}/{{.Architecture}}')"
          echo "image platform: $platform"
          if [ "$platform" != "linux/amd64" ]; then
            echo "::error::built image reports '$platform', not linux/amd64 — Container Apps only runs amd64 and this image would crash-loop with an exec format error and no other clue (see the Dockerfile's own comment)."
            exit 1
          fi

      - name: Start the container and wait for it to report healthy
        run: |
          # APP_PASSCODE isn't otherwise set here, and the app's lifespan
          # hook resolves it eagerly at startup (fail-closed, since
          # REQUIRE_PASSCODE defaults on) — same reason `make run` sets it.
          docker run -d --name career-ci -e APP_PASSCODE=ci-verify career:ci-verify

          for _ in $(seq 1 30); do
            state="$(docker inspect --format='{{.State.Status}}' career-ci)"
            health="$(docker inspect --format='{{.State.Health.Status}}' career-ci)"
            echo "container state: $state, health: $health"

            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            if [ "$state" = "exited" ] || [ "$state" = "dead" ] || [ "$health" = "unhealthy" ]; then
              echo "::error::career-ci did not come up healthy (state: $state, health: $health) — see the logs above."
              exit 1
            fi
            sleep 2
          done

          echo "::error::career-ci never reported healthy within the timeout — see the logs above."
          exit 1

      - name: Container logs
        if: always()
        run: docker logs career-ci

      - name: Clean up
        if: always()
        run: docker rm -f career-ci

  # The required status check ("container-build"), covering both the build and
  # the startup check. Skipped counts as success, so a pull request that
  # touches nothing in the image passes; a failed or cancelled job fails it.
  # Without this, Renovate's platform auto-merge did not wait for the build,
  # and a Python 3.15 base image that could not build merged.
  container-build:
    needs: [changes, build, verify]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the build and startup jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          echo "changes=$CHANGES_RESULT build=$BUILD_RESULT verify=$VERIFY_RESULT"
          # A failed path filter skips the build, which must not read as a pass.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::The path filter did not run, so the build was never decided."
            exit 1
          fi
          for r in "$BUILD_RESULT" "$VERIFY_RESULT"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::The container build or its startup check failed."
              exit 1
            fi
          done

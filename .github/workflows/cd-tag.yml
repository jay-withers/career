name: cd-tag

on:
  push:
    branches: [main]

jobs:
  # Bump the semver tag from the conventional commits since the last release
  # (and create a matching GitHub release) via the shared release template.
  tag:
    permissions:
      contents: write
    uses: jay-withers/workflows/.github/workflows/release.yml@a5015ee2aed310376c5a0a1b19ced327dfd4fbd4 # v1.4.5

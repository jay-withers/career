name: cd-tag

on:
  push:
    branches: [main]

jobs:
  # Bump the semver tag from the conventional commits since the last release
  # (and create a matching GitHub release) via the shared release template.
  tag:
    permissions:
      contents: write
    uses: jay-withers/workflows/.github/workflows/release.yml@6599cdd2b3f2870119a2de439360471b2b94765e # v1.4.11

  # Whether the image actually needs rebuilding. The shared release.yml's
  # `default-bump` is left at "patch", so `tag` bumps *some* version for every
  # push with a new commit, regardless of whether that push touched the
  # application source. A terraform-only or docs-only change gets a version
  # and a GitHub release the same as a code change does, and republishing the
  # image for it would be a wasted build plus a moved IMAGE_TAG default with
  # no code change behind it.
  #
  # The paths below must stay in step with ci-container-build.yml's filter
  # and with the Dockerfile's COPY lines: something in the image but in
  # neither list would change without ever triggering a rebuild.
  changes:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.diff.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: diff
        run: |
          prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$prev_tag" ]; then
            echo "no previous release tag — publishing unconditionally"
            echo "apps=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$prev_tag"..HEAD -- src/ Dockerfile pyproject.toml uv.lock; then
            echo "apps=false" >> "$GITHUB_OUTPUT"
          else
            echo "apps=true" >> "$GITHUB_OUTPUT"
          fi

  # Publish runs as a reusable workflow so the same job can be re-triggered
  # manually (workflow_dispatch) against an existing tag if a build fails,
  # without minting a new version.
  publish:
    needs: [tag, changes]
    if: needs.tag.outputs.tag != '' && needs.changes.outputs.apps == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cd-publish.yml
    with:
      version: ${{ needs.tag.outputs.tag }}

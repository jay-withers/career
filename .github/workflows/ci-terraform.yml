name: ci-terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Credential-free init and validate. pull-requests: read is what the shared
  # workflow's own path filter needs; it runs inside that workflow, so the
  # permission has to be granted from here.
  #
  # There is no plan job here: this repository resolves the shared Container
  # Apps environment through a data source, so a plan needs real Azure
  # credentials against an already-applied platform — run `make plan`
  # locally instead.
  terraform:
    permissions:
      contents: read
      pull-requests: read
    uses: jay-withers/workflows/.github/workflows/terraform.yml@0619e50b64233b7132aa7557fb78b2331fd9c5b1 # v1.5.2

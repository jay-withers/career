name: cd-publish

# Publishes the image to GHCR for a given tag. Invoked by cd-tag after a
# version bump, or manually to (re)publish an existing tag.
#
# Two tags are pushed, both immutable:
#
#   vX.Y.Z    the release this came from, for a deploy someone has to reason
#             about later
#   <sha>     the short commit SHA, which is what the Makefile's IMAGE_TAG
#             defaults to
#
# Neither is ever moved. Container Apps only creates a revision when the
# template changes, so re-pushing a moving tag would deploy nothing and
# report success — the failure mode this avoids by construction.
on:
  workflow_call:
    inputs:
      version:
        description: Git tag to publish (e.g. v1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing git tag to publish (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # `ref` is the tag rather than the default checkout, and that is what makes
  # tag-with-sha correct: on a workflow_call github.sha is the calling
  # branch's head, not the tag, so resolving the short SHA from anything
  # else would record a commit that was never built.
  publish:
    permissions:
      contents: read
      packages: write
    uses: jay-withers/workflows/.github/workflows/docker.yml@a5015ee2aed310376c5a0a1b19ced327dfd4fbd4 # v1.4.5
    with:
      images: |
        [{"name": "career", "context": "."}]
      ref: ${{ inputs.version }}
      push: true
      tags: ${{ inputs.version }}
      tag-with-sha: true
      summary-note: Deploy with `make deploy IMAGE_TAG=${{ inputs.version }}`.

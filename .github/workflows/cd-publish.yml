name: cd-publish

# Publishes the image to GHCR for a given tag, then deploys it to dev. Invoked by cd-tag after a
# version bump, or manually to (re)publish an existing tag.
#
# Two tags are pushed, both immutable:
#
#   vX.Y.Z    the release this came from, for a deploy someone has to reason
#             about later
#   <sha>     the short commit SHA, which is what the Makefile's IMAGE_TAG
#             defaults to
#
# Neither is ever moved. Container Apps only creates a revision when the
# template changes, so re-pushing a moving tag would deploy nothing and
# report success — the failure mode this avoids by construction.
on:
  workflow_call:
    inputs:
      version:
        description: Git tag to publish (e.g. v1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing git tag to publish (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # `ref` is the tag rather than the default checkout, and that is what makes
  # tag-with-sha correct: on a workflow_call github.sha is the calling
  # branch's head, not the tag, so resolving the short SHA from anything
  # else would record a commit that was never built.
  publish:
    permissions:
      contents: read
      packages: write
    uses: jay-withers/workflows/.github/workflows/docker.yml@74e8ea455cea667b8c6bcf0de23d8f37eeb31fec # v1.10.0
    with:
      images: |
        [{"name": "career", "context": "."}]
      ref: ${{ inputs.version }}
      push: true
      tags: ${{ inputs.version }}
      tag-with-sha: true
      summary-note: The `deploy` job rolls this onto dev. To redeploy, re-run this workflow with the tag.

  # Rolls the tag just published onto dev with this repo's own `make deploy`,
  # through the shared container-apps-deploy.yml: OIDC in the `dev` GitHub
  # environment, then `make deploy IMAGE_TAG=<version>` from a checkout of the
  # tag. It runs on a manual re-publish too, so workflow_dispatch is also how
  # to redeploy an existing tag.
  #
  # id-token: write must also be granted by cd-tag's publish job, which calls
  # this workflow: a called workflow never holds more than its caller.
  deploy:
    needs: publish
    permissions:
      id-token: write
      contents: read
      issues: write # the deploy-failed issue
    uses: jay-withers/workflows/.github/workflows/container-apps-deploy.yml@74e8ea455cea667b8c6bcf0de23d8f37eeb31fec # v1.10.0
    with:
      version: ${{ inputs.version }}

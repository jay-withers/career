{#- A "Refresh now" button that runs the pipeline at `action`, disabling
    itself and showing the progress bar (`#refresh-progress`) meanwhile — see
    the `data-refresh` handler in base.html. -#}
{% macro refresh_button(action) %}
  <form
    method="post"
    action="{{ action }}"
    class="inline"
    data-refresh
  >
    <button type="submit" class="primary">Refresh now</button>
  </form>
{% endmacro %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}career{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {% set path = request.url.path %}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><span class="brand-mark">&#9670;</span> career</a>
      <nav class="main-nav">
        <a href="/" {{ 'aria-current="page"' | safe if path == "/" }}>Home</a>
        <a href="/jobs" {{ 'aria-current="page"' | safe if path.startswith("/jobs") }}>Jobs</a>
        <a href="/insights" {{ 'aria-current="page"' | safe if path.startswith("/insights") }}>Insights</a>
        <a href="/profile/roles" {{ 'aria-current="page"' | safe if path.startswith("/profile") }}>Profile</a>
      </nav>
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}career{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {% set path = request.url.path %}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><span class="brand-mark">&#9670;</span> career</a>
      <nav class="main-nav">
        <a href="/" {{ 'aria-current="page"' | safe if path == "/" }}>Home</a>
        <a href="/jobs" {{ 'aria-current="page"' | safe if path.startswith("/jobs") }}>Jobs</a>
        <a href="/insights" {{ 'aria-current="page"' | safe if path.startswith("/insights") }}>Insights</a>
        <a href="/profile/roles" {{ 'aria-current="page"' | safe if path.startswith("/profile") }}>Profile</a>
      </nav>
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <script nonce="{{ request.state.csp_nonce }}">
    // Behaviour that used to sit in inline `on*=` attributes, which the CSP
    // (api/headers.py) blocks. Delegated, so partials only need the attribute.

    // `data-refresh`: a pipeline run takes seconds, so the button disables
    // itself and the progress bar (`#refresh-progress`) shows meanwhile.
    document.addEventListener('submit', function (event) {
      var form = event.target;
      if (!('refresh' in form.dataset)) return;
      var button = form.querySelector('button');
      button.disabled = true;
      button.textContent = 'Refreshing…';
      var progress = document.getElementById('refresh-progress');
      if (progress) progress.hidden = false;
    });

    // `data-autosubmit`: a select that saves as soon as it changes.
    document.addEventListener('change', function (event) {
      if ('autosubmit' in event.target.dataset) event.target.form.submit();
    });
  </script>
</body>
</html>

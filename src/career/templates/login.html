<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>career — sign in</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="login">
    <form method="post" action="/login" class="card">
      <div class="brand"><span class="brand-mark">&#9670;</span> career</div>
      <input type="password" name="passcode" placeholder="Passcode" aria-label="Passcode" autofocus>
      <button type="submit" class="primary">Sign in</button>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
  </main>
</body>
</html>
